<!doctype html>
<html>
<head><meta charset="utf-8"><title>BarChart</title><style>body{background:var(--bg-200);padding:16px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} </style></head>
<body>
<div id="root"></div>
<script>
var C = window.CycleLab, h = React.createElement;
function demoSeries(n, f) { var out = []; for (var i = 0; i < n; i++) out.push(f(i)); return out; }
var data=['8 sep','15 sep','22 sep','29 sep','6 oct','13 oct','20 oct','27 oct'].map(function(w,i){return {x:w,e:180+i*12,i:90+(i%3)*30,c:i%2?160:0,m:i%3?0:120,ctl:58+i*1.6}});
ReactDOM.createRoot(document.getElementById("root")).render(h(C.BarChart,{data:data,height:200,legend:true,series:[{key:'e',label:'Resistencia',color:'z2'},{key:'i',label:'Intervalos',color:'z5'},{key:'c',label:'Ascensión',color:'z4'},{key:'m',label:'BTT',color:'speed'}],line:{key:'ctl',label:'CTL',color:'fitness'}}));
</script>
</body>
</html>
