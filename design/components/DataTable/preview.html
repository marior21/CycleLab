<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataTable</title><style>body{background:var(--bg-200);padding:16px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} </style></head>
<body>
<div id="root"></div>
<script>
var C = window.CycleLab, h = React.createElement;
function demoSeries(n, f) { var out = []; for (var i = 0; i < n; i++) out.push(f(i)); return out; }
var rows=[{id:1,d:'mar 27 oct',n:'3×12′ sweet spot',np:236,tss:91},{id:2,d:'dom 25 oct',n:'Fondo por el valle del Pas',np:184,tss:77},{id:3,d:'sáb 24 oct',n:'Estacas de Trueba',np:205,tss:180}];
function D(){var s=React.useState(1),c=React.useState([2]);return h(C.DataTable,{rows:rows,selected:s[0],onSelect:s[1],checked:c[0],onCheck:function(k){c[1](c[0].indexOf(k)>=0?c[0].filter(function(x){return x!==k}):c[0].concat([k]).slice(-2))},columns:[{key:'d',label:'Fecha'},{key:'n',label:'Actividad'},{key:'np',label:'NP',align:'right',render:function(r){return r.np+' W'}},{key:'tss',label:'TSS',align:'right'}]});}
ReactDOM.createRoot(document.getElementById("root")).render(h(D));
</script>
</body>
</html>
