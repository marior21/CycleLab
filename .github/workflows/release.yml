name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SIGNED: ${{ secrets.MAC_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const assert = require('node:assert/strict'); assert.equal(process.env.GITHUB_REF_NAME, 'v' + require('./package.json').version, 'El tag debe coincidir con package.json');"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Signs and notarizes the Mac builds only when the owner's secrets exist;
      # without them the installers stay unsigned. Windows is never signed.
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      - name: Check signature and notarization
        if: matrix.platform == 'mac' && env.SIGNED == 'true'
        run: |
          app=$(find dist -maxdepth 2 -name CycleLab.app -print -quit)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
      # Both Mac jobs write latest-mac.yml; keep them apart until the release job merges them.
      - name: Name update metadata by architecture
        if: matrix.platform == 'mac'
        run: mv dist/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Merge Mac update metadata
        run: |
          node scripts/merge-latest-mac.mjs installers/latest-mac-arm64.yml installers/latest-mac-x64.yml installers/latest-mac.yml
          rm installers/latest-mac-*.yml
      - name: Upload installers to draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "La release ya está publicada; crea una versión nueva."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "CycleLab $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
