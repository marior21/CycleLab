<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8c8aff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8c8aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb224" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb224" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="512" cy="512" r="236"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824 px body centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- wheel, open towards the summit -->
  <circle cx="512" cy="512" r="270" fill="none" stroke="#8c8aff" stroke-width="56" stroke-linecap="round"
          stroke-dasharray="1432 264" transform="rotate(-7 512 512)"/>
  <!-- climb / power profile -->
  <path clip-path="url(#inner)" fill="url(#area)"
        d="M260 640 L350 590 L410 612 L500 500 L560 532 L660 400 L760 300 L760 760 L260 760 Z"/>
  <path fill="none" stroke="#ffb224" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
        d="M300 618 L350 590 L410 612 L500 500 L560 532 L660 400 L752 326"/>
  <circle cx="752" cy="326" r="38" fill="#ffb224"/>
  <circle cx="752" cy="326" r="14" fill="#0d0c26"/>
</svg>
