name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  electron:
    name: Recorridos Electron en macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The maintenance test opens an exported HTML report in Chromium.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      # Captures both themes next to the prototype for review; it does not fail on differences.
      - run: node scripts/visual.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: artifacts/visual/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: electron-test-results
          path: test-results/
          retention-days: 7
